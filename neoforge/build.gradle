plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	// Common classes are bundled into the loader jar after remapping.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

loom {
	runs {
		client {
			// A fixed name keeps the same offline UUID between launches, so farms and table sessions stay with the player.
			programArgs "--username", "Davi"
		}
	}
}

processResources {
	inputs.property 'version', project.version

	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${rootProject.archives_base_name}" }
	}
}

remapJar {
	input.set shadowJar.archiveFile
}

evaluationDependsOn(':common')

// Ship the shared sources next to the loader sources so IDE and debugging work from the published jar.
sourcesJar {
	from project(':common').sourceSets.main.allSource
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
