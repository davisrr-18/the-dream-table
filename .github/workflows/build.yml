name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # build runs the tests, verifyNoLoaderImports and verifyRootLocale through check.
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: the-dream-table-jars
          path: build/release/
          if-no-files-found: error
