name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # build runs the tests, verifyNoLoaderImports and verifyRootLocale through check.
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: the-dream-table-jars
          path: build/release/
          if-no-files-found: error

  # Boots the dev dedicated server of each loader after a green build: it must reach "Done (", stop on the console
  # command, save its dimensions, and leave no exception from the_dream_table in the log (see the script for details).
  server-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Dedicated server smoke (${{ matrix.loader }})
        run: bash .github/scripts/server-smoke.sh "${{ matrix.loader }}"
        env:
          LOG_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-smoke-${{ matrix.loader }}
          path: ${{ runner.temp }}/server-${{ matrix.loader }}.log
          if-no-files-found: ignore
