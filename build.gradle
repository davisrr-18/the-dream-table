plugins {
	id 'dev.architectury.loom' version '1.17.493' apply false
	id 'architectury-plugin' version '3.5.170'
	id 'com.gradleup.shadow' version '9.2.2' apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'

	base {
		// The Minecraft version in the name keeps each version's jars apart in build/release/ and on CurseForge.
		archivesName = "$rootProject.archives_base_name-$project.name-mc$rootProject.minecraft_version"
	}

	repositories {
		mavenCentral()
		maven { url = 'https://maven.neoforged.net/releases/' }
		maven { url = 'https://maven.minecraftforge.net/' }
	}

	dependencies {
		minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
		// Plain Yarn: no Forge patch exists for 1.20.1, and Forge shares these mappings with common.
		mappings "net.fabricmc:yarn:$rootProject.yarn_mappings:v2"
	}

	java {
		withSourcesJar()
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	// Minecraft 1.20.1 runs on Java 17; the JDK 21 toolchain compiles for it.
	tasks.withType(JavaCompile).configureEach {
		it.options.release = 17
	}

	// Lets smoke runs feed console commands to the dev server.
	tasks.withType(JavaExec).configureEach {
		if (it.name == 'runServer') {
			it.standardInput = System.in
		}
	}

	if (project.name != 'common') {
		// One folder per loader holding only its publishable jar (build/release/<loader>/), for separate CurseForge uploads.
		def releaseJar = tasks.register('releaseJar', Sync) {
			from tasks.named('remapJar')
			into rootProject.layout.buildDirectory.dir("release/$project.name")
			// Keeps the other Minecraft versions' jars handed over in the same folder; replaces only this version's.
			preserve {
				include '*.jar'
				exclude "*-mc${rootProject.minecraft_version}-*"
			}
		}
		tasks.named('assemble') { dependsOn releaseJar }
	}
}
