plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common

	// Common classes are bundled into the loader jar after remapping.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
	modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
	modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand version: project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
}

evaluationDependsOn(':common')

// Ship the shared sources next to the loader sources so IDE and debugging work from the published jar.
sourcesJar {
	from project(':common').sourceSets.main.allSource
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Tests that need Minecraft bootstrap live here: fabric-loader-junit fixes the package access plain JUnit cannot.
dependencies {
	testImplementation "net.fabricmc:fabric-loader-junit:$rootProject.fabric_loader_version"
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}
