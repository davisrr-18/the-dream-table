plugins {
	id 'dev.architectury.loom' version '1.17.493' apply false
	id 'architectury-plugin' version '3.5.170'
	id 'com.gradleup.shadow' version '9.2.2' apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'

	base {
		archivesName = "$rootProject.archives_name-$project.name"
	}

	repositories {
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.neoforged.net/releases/' }
	}

	dependencies {
		minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
		// Yarn stays the source of truth; the patch fills in the NeoForge-only names.
		mappings loom.layered {
			it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings:v2")
			it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$rootProject.yarn_mappings_patch_neoforge_version")
		}
	}

	java {
		withSourcesJar()
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	// Lets smoke runs feed console commands to the dev server.
	tasks.withType(JavaExec).configureEach {
		if (it.name == 'runServer') {
			it.standardInput = System.in
		}
	}
}
